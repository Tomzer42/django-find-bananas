# Render Blueprint: two web services built from the same code.
#   find-bananas          production, deploys the `main` branch (paid plan)
#   find-bananas-staging  rehearsal, deploys the `develop` branch (free plan:
#                         sleeps after 15 min idle, ~1 min to wake up)
# Each has its own PostgreSQL database (Neon: the `main` branch for
# production, a `staging` branch for staging) whose URL goes in DATABASE_URL.
# See README.md > "Deploy".
services:
  - type: web
    name: find-bananas
    runtime: python
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput && python manage.py generate_editions
    startCommand: gunicorn django_project.wsgi --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 30
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: find-bananas.onrender.com,find-bananas.com,www.find-bananas.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://find-bananas.onrender.com,https://find-bananas.com,https://www.find-bananas.com
      - key: DJANGO_TRUSTED_PROXY_COUNT
        value: "1"
      - key: SITE_URL
        value: https://find-bananas.com
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Optional until an email provider is chosen (password-reset emails
      # are only logged without it).
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: Find Bananas <no-reply@find-bananas.com>

  - type: web
    name: find-bananas-staging
    runtime: python
    region: frankfurt
    plan: free
    branch: develop
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # The free plan has no pre-deploy step: migrations run at start-up.
    startCommand: python manage.py migrate --noinput && python manage.py generate_editions && gunicorn django_project.wsgi --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 30
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: find-bananas-staging.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://find-bananas-staging.onrender.com
      - key: DJANGO_TRUSTED_PROXY_COUNT
        value: "1"
      - key: SITE_URL
        value: https://find-bananas-staging.onrender.com
      - key: DJANGO_NOINDEX
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
