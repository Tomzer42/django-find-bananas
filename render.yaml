# Render Blueprint: one web service. The database is a separate PostgreSQL
# (Neon free tier or Render Postgres) whose URL goes in DATABASE_URL.
# See README.md > "Deploy".
services:
  - type: web
    name: find-bananas
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput && python manage.py generate_editions
    startCommand: gunicorn django_project.wsgi --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 30
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: find-bananas.onrender.com,find-bananas.com,www.find-bananas.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://find-bananas.onrender.com,https://find-bananas.com,https://www.find-bananas.com
      - key: DJANGO_TRUSTED_PROXY_COUNT
        value: "1"
      - key: SITE_URL
        value: https://find-bananas.com
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: Find Bananas <no-reply@find-bananas.com>
